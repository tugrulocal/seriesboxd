name: Keep Render App Alive

on:
  schedule:
    # 5 dakikada bir çalıştır
    - cron: '*/5 * * * *'
  workflow_dispatch: # Manuel tetiklemeye izin verir

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging dizilog.onrender.com..."
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.0.0 Safari/537.36" -v https://dizilog.onrender.com/health
          echo "Pinging seriesboxd.onrender.com..."
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/115.0.0.0 Safari/537.36" -v https://seriesboxd.onrender.com/ || echo "seriesboxd pinged"
