name: Keep Render App Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render from sleeping (which happens after 15 mins)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App
        run: |
          echo "Pinging seriesboxd.onrender.com..."
          curl -sSf -o /dev/null https://seriesboxd.onrender.com/health || echo "Failed to ping seriesboxd"
          
          echo "Pinging dizilog.onrender.com..."
          curl -sSf -o /dev/null https://dizilog.onrender.com/health || echo "Failed to ping dizilog"
